# Jalankan:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pln
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pln}
      POSTGRES_DB: pln
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pln -d pln"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pln:${DB_PASSWORD:-pln}@db:5432/pln
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
