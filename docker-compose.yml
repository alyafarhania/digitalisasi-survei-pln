# Aplikasi baru (Next.js) lewat Docker.  Jalankan:  docker compose up --build -d
# Buka http://localhost:<HTTP_PORT>  (HTTP_PORT diambil dari .env, bawaan 8080)
# Mode data "mock": data tersimpan di browser, tidak butuh database.
# Susunan lama (web/ + api + PostgreSQL + adminer) disimpan di docker-compose.web-lama.yml
#   -> jalankan dengan:  docker compose -f docker-compose.web-lama.yml up --build -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DATA_MODE: mock
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy