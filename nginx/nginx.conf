upstream next_app { server app:3000; keepalive 16; }

# Berkas /_next/static memakai hash pada namanya -> aman di-cache lama.
proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next:10m max_size=200m inactive=7d use_temp_path=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;           # unggah foto lokasi

  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_proxied any; gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /_next/static/ {
    proxy_pass http://next_app;
    proxy_cache next; proxy_cache_valid 200 7d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # service worker harus selalu dicek ulang
  location = /sw.js { proxy_pass http://next_app; add_header Cache-Control "no-cache"; }
  # data master mock (diganti API saat backend siap)
  location /mock/ { proxy_pass http://next_app; add_header Cache-Control "public, max-age=300"; }
  # aliran real time (SSE) tidak boleh di-buffer — disiapkan untuk tahap backend
  location /api/events { proxy_pass http://next_app; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; add_header X-Accel-Buffering no; }
  location / { proxy_pass http://next_app; }
}

